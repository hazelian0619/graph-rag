name: Release Metadata

on:
  pull_request:
    paths:
      - 'protein/products/**'
      - 'protein/release/**'
      - 'rna/products/**'
      - 'rna/release/**'
      - 'molecule/products/**'
      - 'molecule/release/**'
      - 'interaction/products/**'
      - 'interaction/release/**'
      - 'schemas/**'
      - 'scripts/build_release_index.py'
      - 'scripts/check_release_consistency.py'
      - 'scripts/validate_release_index.py'
      - 'scripts/download_dataset.py'
      - 'tests/release/**'
  push:
    branches: [ main ]
    paths:
      - 'protein/products/**'
      - 'protein/release/**'
      - 'rna/products/**'
      - 'rna/release/**'
      - 'molecule/products/**'
      - 'molecule/release/**'
      - 'interaction/products/**'
      - 'interaction/release/**'
      - 'schemas/**'
      - 'scripts/build_release_index.py'
      - 'scripts/check_release_consistency.py'
      - 'scripts/validate_release_index.py'
      - 'scripts/download_dataset.py'
      - 'tests/release/**'

jobs:
  index-and-consistency:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: [protein, rna, molecule, interaction]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install jsonschema pytest

      - name: Build release index
        run: |
          python3 scripts/build_release_index.py --products-root ${{ matrix.domain }}/products --out ${{ matrix.domain }}/release/index.json

      - name: Validate release index schema and paths
        run: |
          python3 scripts/validate_release_index.py \
            --index ${{ matrix.domain }}/release/index.json \
            --schema schemas/release-index.schema.json \
            --repo-root .

      - name: Check release consistency (report mode)
        run: |
          python3 scripts/check_release_consistency.py \
            --index ${{ matrix.domain }}/release/index.json \
            --out ${{ matrix.domain }}/release/consistency_report.json \
            --allow-issues

      - name: Upload release metadata reports
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata-${{ matrix.domain }}
          path: |
            ${{ matrix.domain }}/release/index.json
            ${{ matrix.domain }}/release/consistency_report.json

  test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest

      - name: Run release metadata tests
        run: |
          pytest -q tests/release
